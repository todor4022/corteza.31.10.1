services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        VERSION: ${VERSION:?Set VERSION in .env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_WEBAPP_LIST: admin,compose,workflow,reporter,privacy,tickets
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
        restart: true
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
    volumes:
      - ./data/server:/data

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
      args:
        VERSION: ${VERSION:?Set VERSION in .env}
    restart: "no"
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/scripts/seed-user.sh"]
    depends_on:
      db:
        condition: service_healthy
    # The image's HTTP healthcheck applies to the web server, not this CLI job.
    healthcheck:
      disable: true
    volumes:
      - ./scripts:/scripts:ro
      - ./seed:/seed:ro
      - ./data/server:/data

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./data/db:/var/lib/postgresql/data
